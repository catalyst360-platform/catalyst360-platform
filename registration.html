<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalyst 360™ - Trainer Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .logo span {
            color: #764ba2;
        }
        
        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            margin: 0;
            gap: 8px;
        }
        
        input[type="radio"] {
            margin: 0;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Catalyst <span>360™</span></div>
            <h1>Academic Trainers Registration</h1>
            <p>Join our network of industry experts and thought leaders</p>
        </div>
        
        <div class="success-message" id="successMessage">
            ✓ Registration successful! Your ID: <strong id="trainerId"></strong>
        </div>
        
        <form id="registrationForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" required>
                    <div class="error" id="firstNameError">First name is required</div>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" required>
                    <div class="error" id="lastNameError">Last name is required</div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="text" id="mobile" placeholder="10 digits" maxlength="10" required>
                <div class="error" id="mobileError">Mobile must be 10 digits</div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="state">State *</label>
                    <select id="state" required onchange="updateCities()">
                        <option value="">Select State</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Gujarat">Gujarat</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="city">City *</label>
                    <select id="city" required>
                        <option value="">Select City</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="education">Education Qualification *</label>
                <select id="education" required>
                    <option value="">Select Qualification</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="M.Tech">M.Tech</option>
                    <option value="MBA">MBA</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="M.Sc">M.Sc</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" required>
                </div>
                <div class="form-group">
                    <label for="workExperience">Work Experience (Years) *</label>
                    <input type="text" id="workExperience" placeholder="e.g., 5" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Working Model *</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="workingModel" value="Consultant" checked>
                        Consultant
                    </label>
                    <label>
                        <input type="radio" name="workingModel" value="Partner">
                        Partner
                    </label>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Register Now</button>
        </form>
    </div>
    
    <script>
        const citiesByState = {
            'Maharashtra': ['Mumbai', 'Pune', 'Nagpur', 'Aurangabad'],
            'Karnataka': ['Bangalore', 'Pune', 'Mysore', 'Hubli'],
            'Tamil Nadu': ['Chennai', 'Coimbatore', 'Madurai', 'Salem'],
            'Telangana': ['Hyderabad', 'Warangal', 'Nizamabad'],
            'Delhi': ['New Delhi', 'East Delhi', 'West Delhi'],
            'Gujarat': ['Ahmedabad', 'Surat', 'Vadodara', 'Rajkot']
        };
        
        function updateCities() {
            const state = document.getElementById('state').value;
            const citySelect = document.getElementById('city');
            citySelect.innerHTML = '<option value="">Select City</option>';
            
            if (state && citiesByState[state]) {
                citiesByState[state].forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            }
        }
        
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validation
            let isValid = true;
            const mobile = document.getElementById('mobile').value;
            
            if (!/^\d{10}$/.test(mobile)) {
                document.getElementById('mobileError').classList.add('show');
                isValid = false;
            } else {
                document.getElementById('mobileError').classList.remove('show');
            }
            
            if (isValid) {
                // Simulate successful registration
                document.getElementById('trainerId').textContent = mobile;
                document.getElementById('successMessage').classList.add('show');
                
                // Reset form
                setTimeout(() => {
                    this.reset();
                    document.getElementById('successMessage').classList.remove('show');
                    // Redirect to assessment page
                    window.location.href = 'assessment.html?trainerId=' + mobile;
                }, 2000);
            }
        });
    </script>
</body>
</html>
